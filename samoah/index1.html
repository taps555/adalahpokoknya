<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Buat Proyek Baru</title>
<style>
  body {
    font-family: Arial, sans-serif;
    max-width: 560px;
    margin: 40px auto;
    padding: 0 16px;
    color: #222;
  }
  h1 { font-size: 20px; margin-bottom: 4px; }
  p.subtitle { font-size: 13px; color: #666; margin-top: 0; margin-bottom: 24px; }
  label { display: block; font-weight: 600; margin-top: 16px; margin-bottom: 4px; font-size: 14px; }
  input, select {
    width: 100%;
    padding: 8px 10px;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-size: 14px;
    box-sizing: border-box;
  }
  #clientNameWrap { display: none; }
  button {
    margin-top: 24px;
    padding: 10px 18px;
    background: #2563eb;
    color: #fff;
    border: none;
    border-radius: 6px;
    font-size: 14px;
    cursor: pointer;
  }
  button:disabled { background: #93c5fd; cursor: not-allowed; }
  .error { color: #b91c1c; font-size: 13px; margin-top: 8px; }
  .success { color: #15803d; font-size: 14px; margin-top: 16px; font-weight: 600; }
  .hint { font-size: 12px; color: #888; margin-top: 4px; }
</style>
</head>
<body>
  <h1>Buat Proyek Baru</h1>
  <p class="subtitle">Isi data dasar proyek lalu pilih data HSPK/AHSP yang sudah ada di database.</p>

  <form id="projectForm">
    <label for="name">Nama Proyek</label>
    <input id="name" type="text" required />

    <label for="clientSelect">Client</label>
    <select id="clientSelect">
      <option value="">-- Pilih Client --</option>
      <option value="__new__">+ Client Baru</option>
    </select>
    <div id="clientNameWrap">
      <input id="clientName" type="text" placeholder="Nama client baru" />
    </div>

    <label for="location">Lokasi</label>
    <input id="location" type="text" required placeholder="Contoh: Jombang, Jawa Timur" />

    <label for="periodSelect">Periode HSPK/AHSP</label>
    <select id="periodSelect" required>
      <option value="">-- Pilih Periode --</option>
    </select>
    <div class="hint" id="periodHint"></div>

    <button type="submit" id="submitBtn">Simpan &amp; Lanjut ke Workspace</button>
    <div class="error" id="errorMsg"></div>
    <div class="success" id="successMsg"></div>
  </form>

  <script src="app.js"></script>
</body>
</html>
